  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#g)" stroke-width="3" filter="url(#glow)"/>
  <text x="50" y="58" text-anchor="middle" font-family="serif" font-size="32" font-weight="bold" fill="#00d4ff" filter="url(#glow)">浪</text>
